version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: autogram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autogram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autogram_secret}
      POSTGRES_DB: ${POSTGRES_DB:-autogram}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    container_name: autogram-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=autogram
      - DB_POSTGRESDB_USER=autogram
      - DB_POSTGRESDB_PASSWORD=autogram_secret
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
      - .:/workspace
    depends_on:
      - postgres

volumes:
  postgres_data:
  n8n_data:
