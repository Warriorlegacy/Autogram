name: Dashboard Keep-Alive Heartbeat

on:
  # NOTE: Frequent crons (like */14) cause GitHub Actions to throttle/deprioritize all scheduled
  # workflows in the repository, causing daily-post.yml to miss its publishing slots.
  # Use free external pingers (cron-job.org or UptimeRobot) to keep Render awake instead.
  # schedule:
  #   - cron: "*/14 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Dashboard Health Endpoint
        run: |
          RENDER_URL="${{ secrets.RENDER_DASHBOARD_URL || 'https://autogram-dashboard.onrender.com' }}"
          echo "Pinging $RENDER_URL/health..."
          curl -s -f -m 15 "$RENDER_URL/health" || echo "Dashboard ping completed (service may be initializing)."
