name: Daily Hindi/Hinglish Promo Reel — Signhify Studio (2x Daily)

# Autonomous Hindi/Hinglish cinematic promo engine promoting Signhify Studio
# Voice: SwaraNeural Hindi, Hinglish scripts, Playwright 1080x1920 rendering
# Live Website: https://signhify.dpdns.org | Brand: @signhify.studio

on:
  schedule:
    - cron: '0 8 * * *'   # 01:30 PM IST (08:00 UTC) — Afternoon Hindi Promo
    - cron: '0 16 * * *'  # 09:30 PM IST (16:00 UTC) — Evening Hindi Promo
  workflow_dispatch:
  repository_dispatch:
    types: [publish-hindi]

concurrency:
  group: daily-hindi-promo
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      DRY_RUN: 'false'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Node.js 22 (HyperFrames)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install
          pip install -r requirements.txt
          pip install edge-tts faster-whisper

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: Run Hindi Promo Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID || secrets.IG_USER_ID }}
          META_GRAPH_ACCESS_TOKEN: ${{ secrets.META_GRAPH_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || secrets.META_GRAPH_ACCESS_TOKEN }}
          META_API_VERSION: ${{ secrets.META_API_VERSION || 'v23.0' }}
        run: |
          python scripts/pipeline_hindi_promo.py

      - name: Commit Content Memory State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/content-memory.json || true
          git diff --cached --quiet || git commit -m "chore(memory): record published Hindi promo [skip ci]"
          git push origin main || echo "Push skipped or not permitted"

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hindi-promo-${{ github.run_number }}
          path: |
            workspace/hindi_promo/**
          retention-days: 14
