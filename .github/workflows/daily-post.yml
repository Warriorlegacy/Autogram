name: Daily Instagram Autopilot (7x Daily)

on:
  schedule:
    # 7 Strategic Daily Posting Slots (Asia/Kolkata timezone)
    # Note: Minutes offset to :03 and :33 to bypass GitHub Actions global queue congestion at :00 and :30
    - cron: "33 2 * * *"   # Slot 1: 08:03 AM IST (02:33 UTC) - Morning Commute & Mindset
    - cron: "03 5 * * *"   # Slot 2: 10:33 AM IST (05:03 UTC) - Deep Work Tools & Architecture
    - cron: "33 7 * * *"   # Slot 3: 01:03 PM IST (07:33 UTC) - Lunch Break Frameworks
    - cron: "03 10 * * *"  # Slot 4: 03:33 PM IST (10:03 UTC) - Mid-Day Growth Hacks & Prompts
    - cron: "33 12 * * *"  # Slot 5: 06:03 PM IST (12:33 UTC) - Outbound & Client Acquisition
    - cron: "03 15 * * *"  # Slot 6: 08:33 PM IST (15:03 UTC) - Prime Evening Deep-Dive
    - cron: "03 17 * * *"  # Slot 7: 10:33 PM IST (17:03 UTC) - Late-Night Founder Operating Systems
  workflow_dispatch: {}    # Manual trigger button in GitHub Actions UI
  repository_dispatch:     # Allows external second-precise webhooks (cron-job.org / curl) to trigger runs
    types: [publish-slot, daily-post]

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium (if not cached)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright system deps only (if browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Execute Autonomous Publishing Pipeline
        timeout-minutes: 15
        run: |
          if [ -n "${IG_ACCESS_TOKEN}" ]; then
            echo "Running direct cloud autonomous pipeline with GitHub runner..."
            python orchestrator.py --run-all
          else
            echo "GitHub IG_ACCESS_TOKEN secret not detected in runner."
            echo "Triggering live Render backend cloud autopilot failover..."
            HTTP_STATUS=$(curl -s -o webhook_response.json -w "%{http_code}" \
              --max-time 30 \
              -X POST "https://autogram-dashboard.onrender.com/api/webhook/autopilot?mode=live" \
              -H "Authorization: Bearer ${AUTOGRAM_OWNER_KEY}" || echo "000")
            echo "Render webhook response (HTTP $HTTP_STATUS):"
            cat webhook_response.json 2>/dev/null || true
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
              echo "Render autopilot triggered successfully."
            else
              echo "Render webhook returned HTTP $HTTP_STATUS — falling back to local dry-run validation..."
              python orchestrator.py --dry-run
            fi
          fi
        env:
          AUTOGRAM_OWNER_KEY: ${{ secrets.AUTOGRAM_OWNER_KEY || 'autogram_owner_vip_2026' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_COPILOT_TOKEN: ${{ secrets.GITHUB_COPILOT_TOKEN || secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_API_VERSION: ${{ secrets.META_API_VERSION || 'v23.0' }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          PUBLIC_CDN_BASE: ${{ secrets.PUBLIC_CDN_BASE || 'https://autogram-dashboard.onrender.com' }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY || 'f0ee2a304a71d5b2da983153c2284b73' }}
          DRY_RUN: ${{ secrets.DRY_RUN || 'false' }}

      - name: Commit Content Memory (Zero Repetition)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/content-memory.json autopilot.db data/dm_automation_state.json || true
          git diff --cached --quiet || git commit -m "chore(memory): record published carousel and auto-dm state [skip ci]"
          git push origin main || echo "Push skipped or not permitted"

      - name: Upload Generated Carousel Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-carousel-artifacts
          path: output/
          retention-days: 14

