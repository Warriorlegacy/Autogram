name: Daily Autonomous Video Autopilot (Shorts & Reels)

on:
  schedule:
    # 10 Daily Autonomous Short-Form Video Slots (Asia/Kolkata timezone)
    # Staggered to avoid GitHub Actions runner queue congestion
    - cron: "33 02 * * *"   # Slot 1:  08:03 AM IST (02:33 UTC) - Morning Kickoff Video
    - cron: "13 04 * * *"   # Slot 2:  09:43 AM IST (04:13 UTC) - Mid-Morning Tool Breakdown
    - cron: "33 05 * * *"   # Slot 3:  11:03 AM IST (05:33 UTC) - Late Morning Tech Reel
    - cron: "33 06 * * *"   # Slot 4:  12:03 PM IST (06:33 UTC) - Midday Viral Short
    - cron: "13 08 * * *"   # Slot 5:  01:43 PM IST (08:13 UTC) - Post-Lunch Workflow Drop
    - cron: "33 09 * * *"   # Slot 6:  03:03 PM IST (09:33 UTC) - Afternoon AI Spotlight
    - cron: "03 11 * * *"   # Slot 7:  04:33 PM IST (11:03 UTC) - Teatime Code Reel
    - cron: "03 13 * * *"   # Slot 8:  06:33 PM IST (13:03 UTC) - Commute Prime Video
    - cron: "33 14 * * *"   # Slot 9:  08:03 PM IST (14:33 UTC) - Prime Evening Drop
    - cron: "33 16 * * *"   # Slot 10: 10:03 PM IST (16:33 UTC) - Late Night Blueprint Drop
  workflow_dispatch:
    inputs:
      destination:
        description: "Publishing Destination"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "reels"
          - "shorts"
      topic:
        description: "Custom Video Topic (leave empty for auto-trending)"
        required: false
        default: ""
      pillar:
        description: "Content Pillar"
        required: false
        default: "AI Tool Breakdown"
        type: choice
        options:
          - "AI Tool Breakdown"
          - "Prompting & Workflow"
          - "Tech Explainer"
          - "Marketing Psychology"
          - "Trending GitHub Spotlight"
          - "Contrarian"
          - "Local AI & Edge Compute"
      mode:
        description: "Execution Mode"
        required: true
        default: "live"
        type: choice
        options:
          - "live"
          - "dry-run"
  repository_dispatch:
    types: [publish-video, publish-reel, publish-shorts]

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Execute Autonomous Video Publishing Pipeline
        timeout-minutes: 20
        run: |
          DEST="${{ github.event.inputs.destination || 'all' }}"
          MODE="${{ github.event.inputs.mode || 'live' }}"
          TOPIC="${{ github.event.inputs.topic || '' }}"
          PILLAR="${{ github.event.inputs.pillar || 'AI Tool Breakdown' }}"

          FLAG="--video"
          if [ "$DEST" = "reels" ]; then
            FLAG="--reel"
          elif [ "$DEST" = "shorts" ]; then
            FLAG="--shorts"
          fi

          CMD_ARGS="$FLAG"
          if [ "$MODE" = "live" ] && [ -n "${IG_ACCESS_TOKEN}" ]; then
            CMD_ARGS="$CMD_ARGS --run-all"
          else
            CMD_ARGS="$CMD_ARGS --dry-run"
          fi

          if [ -n "$TOPIC" ]; then
            CMD_ARGS="$CMD_ARGS --topic \"$TOPIC\" --pillar \"$PILLAR\""
          fi

          echo "Running command: python orchestrator.py $CMD_ARGS"
          if [ -n "${IG_ACCESS_TOKEN}" ] || [ "$MODE" = "dry-run" ]; then
            python orchestrator.py $CMD_ARGS
          else
            echo "GitHub IG_ACCESS_TOKEN secret not detected. Falling back to Render cloud backend..."
            ENDPOINT="video"
            if [ "$DEST" = "reels" ]; then
              ENDPOINT="reel"
            elif [ "$DEST" = "shorts" ]; then
              ENDPOINT="shorts"
            fi
            HTTP_STATUS=$(curl -s -o video_response.json -w "%{http_code}" \
              --max-time 60 \
              -X POST "https://autogram-dashboard.onrender.com/api/publish/$ENDPOINT" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${AUTOGRAM_OWNER_KEY}" \
              -d "{\"topic\": \"$TOPIC\", \"pillar\": \"$PILLAR\", \"mode\": \"$MODE\"}" || echo "000")
            echo "Render video response (HTTP $HTTP_STATUS):"
            cat video_response.json 2>/dev/null || true
            if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
              echo "Render fallback failed — executing local dry-run validation..."
              python orchestrator.py $FLAG --dry-run
            fi
          fi
        env:
          AUTOGRAM_OWNER_KEY: ${{ secrets.AUTOGRAM_OWNER_KEY || 'autogram_owner_vip_2026' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_COPILOT_TOKEN: ${{ secrets.GH_COPILOT_TOKEN || secrets.COPILOT_TOKEN || secrets.GITHUB_TOKEN }}
          GH_COPILOT_TOKEN: ${{ secrets.GH_COPILOT_TOKEN || secrets.COPILOT_TOKEN }}
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN || secrets.GH_COPILOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_API_VERSION: ${{ secrets.META_API_VERSION || 'v23.0' }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PUBLIC_CDN_BASE: ${{ secrets.PUBLIC_CDN_BASE || 'https://autogram-dashboard.onrender.com' }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY || 'f0ee2a304a71d5b2da983153c2284b73' }}
          DRY_RUN: ${{ secrets.DRY_RUN || 'false' }}

      - name: Commit Content Memory State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/content-memory.json autopilot.db data/dm_automation_state.json || true
          git diff --cached --quiet || git commit -m "chore(memory): record published video drop [skip ci]"
          git push origin main || echo "Push skipped or not permitted"

      - name: Upload Generated Video Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-artifacts
          path: output/
          retention-days: 14
