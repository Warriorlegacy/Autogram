name: Signhify 60s Reels Autopilot — 3x Daily (Authoritative)

# AUTHORITATIVE 3-slot publisher. daily_reels.yml is deprecated and must not publish.
# Slots (Asia/Kolkata): 10:30 / 14:30 / 20:30 IST = 05:00 / 09:00 / 15:00 UTC.
# Runs fully in GitHub Actions; PC shutdown has no impact. Zero paid services required.

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: "Custom topic (empty = autonomous discovery)"
        required: false
        default: ""
      pillar:
        description: "Content pillar"
        required: false
        default: ""
      dry_run:
        description: "Render + QA without publishing"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      force_template:
        description: "Visual theme A-E (empty = rotation)"
        required: false
        default: ""
      publish_reel:
        description: "Publish Reel"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      publish_story:
        description: "Repost same MP4 to Story"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
  repository_dispatch:
    types: [publish-video, publish-reel, publish-shorts]

concurrency:
  # One publisher per slot; retries never double-publish (slot-key idempotency).
  group: signhify-60s-${{ github.workflow }}-${{ github.run_id }}-${{ github.event.schedule || github.event.inputs.topic || 'slot' }}
  cancel-in-progress: false

jobs:
  reel60:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve publishing slot (IST)
        id: slot
        run: |
          H=$(date -u +%H)
          if [ "$H" = "05" ]; then SLOT=morning; elif [ "$H" = "09" ]; then SLOT=afternoon; else SLOT=night; fi
          if [ -n "${{ github.event.inputs.topic }}" ]; then :; fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "Resolved slot: $SLOT (UTC hour $H)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install FFmpeg + Chromium + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation espeak-ng
          python -m pip install --upgrade pip

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium (HyperFrames only)
        run: python -m playwright install chromium --with-deps || python -m playwright install chromium || true

      - name: Run 60s autonomous Reel slot
        timeout-minutes: 45
        run: |
          ARGS="--slot ${{ steps.slot.outputs.slot }}"
          if [ -n "${{ github.event.inputs.topic }}" ]; then ARGS="$ARGS --topic ${{ github.event.inputs.topic }}"; fi
          if [ -n "${{ github.event.inputs.pillar }}" ]; then ARGS="$ARGS --pillar ${{ github.event.inputs.pillar }}"; fi
          if [ -n "${{ github.event.inputs.force_template }}" ]; then ARGS="$ARGS --force-template ${{ github.event.inputs.force_template }}"; fi
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.publish_reel }}" = "false" ]; then ARGS="$ARGS --no-publish-reel"; fi
          if [ "${{ github.event.inputs.publish_story }}" = "false" ]; then ARGS="$ARGS --no-publish-story"; fi
          echo "python scripts/run_60s_reel.py $ARGS"
          python scripts/run_60s_reel.py $ARGS
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_API_VERSION: ${{ secrets.META_API_VERSION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          META_GRAPH_ACCESS_TOKEN: ${{ secrets.META_GRAPH_ACCESS_TOKEN }}
          PUBLIC_CDN_BASE: ${{ secrets.PUBLIC_CDN_BASE }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          FREEIMAGE_API_KEY: ${{ secrets.FREEIMAGE_API_KEY }}
          AUTOGRAM_OWNER_KEY: ${{ secrets.AUTOGRAM_OWNER_KEY }}
          REELS_VOICE: ${{ secrets.REELS_VOICE }}
          SLOT_HINT: ${{ steps.slot.outputs.slot }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          ENABLE_HYPERFRAMES: "true"

      - name: Commit content memory (idempotency keys)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/content-memory.json output/ || true
          git diff --cached --quiet || git commit -m "chore(memory): 60s reel ${{ steps.slot.outputs.slot }} [skip ci]"
          git push origin main || echo "Push skipped"

      - name: Upload slot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel60-${{ steps.slot.outputs.slot }}-${{ github.run_number }}
          path: |
            output/
            workspace/
          retention-days: 14
