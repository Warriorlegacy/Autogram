name: Autogram 24/7 Cloud Autopilot

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Publishing Format / Slot (auto | carousel | reel | story)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - carousel
          - reel
          - story
      reel_id:
        description: "Target Reel ID from docs/reel-studio-kit (e.g. doc-engine, replaced-editor, local-voice, diwali-dev-mode)"
        required: false
        default: ""
      topic:
        description: "Custom Topic Override (leave blank for zero-repetition auto-trending)"
        required: false
        default: ""
      pillar:
        description: "Content Pillar (optional)"
        required: false
        default: ""
      dry_run:
        description: "Dry Run Mode (false = publish live to Instagram)"
        required: true
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 3. Install Core Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Install Playwright Headless Chromium & System Fonts
        run: |
          playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y fonts-inter fonts-jetbrains-mono ffmpeg

      - name: 5. Setup Node.js 20 (For Remotion Reels)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: docs/reel-studio-kit/package.json

      - name: 6. Install Reel Studio Kit Dependencies
        run: |
          if [ -d "docs/reel-studio-kit" ]; then
            cd docs/reel-studio-kit
            npm ci --prefer-offline || npm install
          fi

      - name: 7. Execute Autonomous Cloud Publishing Engine
        env:
          AUTOGRAM_OWNER_KEY: ${{ secrets.AUTOGRAM_OWNER_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET || secrets.S3_BUCKET || 'autogram-media' }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET || secrets.CLOUDFLARE_R2_BUCKET || 'autogram-media' }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY || secrets.CLOUDFLARE_R2_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY || secrets.CLOUDFLARE_R2_SECRET_KEY }}
          S3_REGION: ${{ secrets.S3_REGION || 'auto' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_API_VERSION: ${{ secrets.META_API_VERSION || 'v26.0' }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_GRAPH_ACCESS_TOKEN: ${{ secrets.META_GRAPH_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
          PUBLIC_CDN_BASE: ${{ secrets.PUBLIC_CDN_BASE || 'https://cdn.signhify.dpdns.org' }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
        run: |
          echo "=================================================="
          echo "🚀 Autogram Cloud Autopilot Starting..."
          echo "Timestamp UTC: $(date -u)"
          echo "=================================================="

          SLOT="${{ github.event.inputs.slot || github.event.client_payload.slot || 'auto' }}"
          REEL_ID="${{ github.event.inputs.reel_id || github.event.client_payload.reel_id || '' }}"
          TOPIC="${{ github.event.inputs.topic || github.event.client_payload.topic || '' }}"
          PILLAR="${{ github.event.inputs.pillar || github.event.client_payload.pillar || '' }}"
          DRY_FLAG="${{ github.event.inputs.dry_run || 'true' }}"

          CMD_ARGS=("--slot" "$SLOT")
          if [ -n "$REEL_ID" ]; then
            CMD_ARGS+=("--reel-id" "$REEL_ID")
          fi
          if [ -n "$TOPIC" ]; then
            CMD_ARGS+=("--topic" "$TOPIC")
          fi
          if [ -n "$PILLAR" ]; then
            CMD_ARGS+=("--pillar" "$PILLAR")
          fi
          if [ "$DRY_FLAG" = "true" ]; then
            CMD_ARGS+=("--dry-run")
          fi

          if [ -z "${IG_ACCESS_TOKEN}" ] || [ -z "${IG_USER_ID}" ]; then
            echo "Instagram credentials are missing; refusing to publish or call a remote failover."
            exit 1
          fi
          echo "✓ Instagram credentials detected in runner."
          python src/scheduler/cloud_autopilot_runner.py "${CMD_ARGS[@]}"

      - name: 8. Persist Content Memory & Anti-Repetition Ledger
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/content-memory.json data/schedule.json autopilot.db data/dm_automation_state.json data/dm_follow_gate.json || true
          git diff --cached --quiet || git commit -m "chore(cloud): update publishing memory and schedule ledger [skip ci]"
          git push origin main || echo "Memory sync completed without conflict."

      - name: 9. Upload Rendered Deliverables (30-Day Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-autopilot-deliverables
          path: |
            output/
            data/schedule.json
            data/content-memory.json
          retention-days: 30
