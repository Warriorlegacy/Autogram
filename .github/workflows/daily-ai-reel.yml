name: daily-ai-reel

# One Reel per run. Seven cron slots a day give seven Reels.
#
# Every run: AI topic -> brief -> validation gates -> render -> QA -> publish.
# FAIL CLOSED: a brief that fails the brand/validation gate, a render that fails
# `hyperframes check`, or a QA defect all stop the run BEFORE publishing.
#
# Reels are never published to a draft PC path — this runs entirely in CI.

on:
  schedule:
    # 09:00 / 11:30 / 14:00 / 16:30 / 19:00 / 21:30 / 23:30 IST (UTC+5:30).
    # GitHub cron is UTC. Minutes are deliberately :30, never :00 — GitHub
    # queues the top of the hour and can delay or drop those jobs.
    - cron: "30 3 * * *"    # 09:00 IST
    - cron: "0 6 * * *"     # 11:30 IST
    - cron: "30 8 * * *"    # 14:00 IST
    - cron: "0 11 * * *"    # 16:30 IST
    - cron: "30 13 * * *"   # 19:00 IST
    - cron: "0 16 * * *"    # 21:30 IST
    - cron: "30 18 * * *"   # 23:30 IST
  workflow_dispatch:
    inputs:
      topic:
        description: "Force a specific topic (blank = let the AI choose)"
        required: false
        default: ""
      dry_run:
        description: "Generate + render + QA, but do NOT publish"
        type: boolean
        required: false
        default: true

# Never let two slots publish at once; queue instead of racing the API quota.
concurrency:
  group: ai-reel-publish
  cancel-in-progress: false

permissions:
  contents: write   # commit topic history so topics do not repeat

env:
  PYTHON_VERSION: "3.12"
  TZ: Asia/Kolkata

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system deps (FFmpeg for mux/loudnorm/probe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-dotenv kokoro-onnx soundfile

      # Kokoro weights are ~340MB. Downloading them every run would dominate the
      # job; cache them keyed on nothing (they never change) with a 30-day TTL.
      - name: Cache Kokoro voice model
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: models/kokoro
          key: kokoro-82b-v1
          restore-keys: kokoro-82b-

      - name: Fetch Kokoro model if cache missed
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          mkdir -p models/kokoro
          base="https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0"
          curl -sSLf "$base/kokoro-v1.0.onnx"  -o models/kokoro/kokoro-v1.0.onnx
          curl -sSLf "$base/voices-v1.0.bin"  -o models/kokoro/voices-v1.0.bin

      - name: Build .env from secrets (never commit)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          # Prefer the PAGE token: no expiry, survives a Facebook password change.
          META_GRAPH_ACCESS_TOKEN: ${{ secrets.META_GRAPH_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          AUTOGRAM_OWNER_KEY: ${{ secrets.AUTOGRAM_OWNER_KEY }}
          # No PUBLIC_CDN_BASE: each run uploads its own Reel and passes the real
          # public URL to the publisher, so a fixed CDN base is not required.
        run: |
          : > .env
          for k in GROQ_API_KEY GEMINI_API_KEY IG_USER_ID META_GRAPH_ACCESS_TOKEN \
                   IG_ACCESS_TOKEN META_APP_ID META_APP_SECRET AUTOGRAM_OWNER_KEY; do
            v="${!k}"
            [ -n "$v" ] && echo "$k=$v" >> .env
          done
          echo "META_API_VERSION=v26.0" >> .env
          echo "DRY_RUN=false" >> .env
          n=$(grep -c '=' .env)
          echo "wrote .env with $n keys"
          if [ "$n" -lt 5 ]; then
            echo "::error::only $n keys written to .env — check the repository secrets exist"
            exit 1
          fi

      - name: Verify publishing credentials before spending a render
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python -m video_studio token-check
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::error::Instagram credentials unhealthy (exit $rc) — no post will be made"
            python - <<'PY'
          import os, requests, pathlib, sys
          sys.path.insert(0, ".")
          from video_studio.instagram import token_health
          h = token_health()
          tok, chat = os.environ.get("TELEGRAM_BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          if not (tok and chat):
              sys.exit(0)
          kind = h.get("token_kind") or "none"
          expiry = ("never" if h.get("never_expires") else
                    (f"{h['days_left']}d" if h.get("days_left") is not None else "unknown"))
          msg = (f"\U0001F6A8 Instagram token unhealthy\n"
                 f"kind: {kind}\nexpiry: {expiry}\n"
                 f"account: @{h.get('username') or '?'}\n"
                 f"quota: {h.get('quota_used')}/{h.get('quota_total')}\n"
                 f"error: {str(h.get('error'))[:220]}\n\n"
                 f"Autogram will not publish until this is fixed.")
          r = requests.post(f"https://api.telegram.org/bot{tok}/sendMessage",
                            json={"chat_id": chat, "text": msg,
                                  "disable_web_page_preview": True}, timeout=20)
          print("telegram:", r.status_code)
          PY
            exit $rc
          fi

      - name: Generate the content brief
        id: brief
        run: |
          if [ -n "${{ inputs.topic }}" ]; then
            python - <<'PY'
          import json, sys
          from pathlib import Path
          from video_studio.ai import generate_brief
          topic = {"slug": "manual", "title": "Manual run",
                   "hook": "${{ inputs.topic }}", "pillar": "product",
                   "angle": "operator supplied"}
          b = generate_brief(topic)
          p = Path("video_studio/briefs/manual.json")
          p.write_text(b.model_dump_json(indent=2), encoding="utf-8")
          print("wrote", p)
          PY
          else
            python -m video_studio generate --count 1
          fi
          # Newest brief on disk wins.
          slug=$(ls -t video_studio/briefs/*.json | head -1 | xargs basename | sed 's/.json//')
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "brief=video_studio/briefs/$slug.json" >> "$GITHUB_OUTPUT"
          echo "using $slug"

      - name: Render + QA (narration on)
        run: |
          python -m video_studio render \
            --brief "${{ steps.brief.outputs.brief }}" \
            --quality standard --audio

      - name: Upload Reel to a public host Meta can fetch
        id: upload
        env:
          REEL_SLUG: ${{ steps.brief.outputs.slug }}
        run: |
          set -euo pipefail
          slug="$REEL_SLUG"
          test -f "video_studio/output/$slug/reel.mp4" || {
            echo "::error::reel.mp4 missing for $slug"; ls -la "video_studio/output/$slug/" || true; exit 1; }
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from src.storage.uploader import AssetUploader
          slug = os.environ["REEL_SLUG"]
          url = AssetUploader().upload_video_file(
              f"video_studio/output/{slug}/reel.mp4", "ci", dry_run=False)
          Path("reel_url.txt").write_text(url, encoding="utf-8")
          print(url)
          PY
          echo "url=$(cat reel_url.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish to Instagram
        id: publish
        if: ${{ !inputs.dry_run }}
        env:
          REEL_SLUG: ${{ steps.brief.outputs.slug }}
        run: |
          slug="$REEL_SLUG"
          python - <<'PY'
          import os, sys
          from pathlib import Path
          from video_studio.instagram import publish_reel
          slug = os.environ["REEL_SLUG"]
          url = Path("reel_url.txt").read_text(encoding="utf-8").strip()
          caption = Path(f"video_studio/output/{slug}/caption.txt").read_text(encoding="utf-8")
          res = publish_reel(slug, url, caption, dry_run=False)
          Path("media_id.txt").write_text(str(res.get("media_id") or ""), encoding="utf-8")
          print("PUBLISHED", res.get("media_id"))
          PY
          echo "media_id=$(cat media_id.txt)" >> "$GITHUB_OUTPUT"

      - name: Notify (Telegram)
        if: always()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          SLUG: ${{ steps.brief.outputs.slug }}
          MEDIA_ID: ${{ steps.publish.outputs.media_id }}
          DRY: ${{ inputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ] && { echo "no telegram secrets; skipping"; exit 0; }
          python - <<'PY'
          import os, requests
          tok, chat = os.environ["TG_TOKEN"], os.environ["TG_CHAT"]
          ok = os.environ.get("STATUS") == "success"
          slug = os.environ.get("SLUG") or "unknown"
          media = os.environ.get("MEDIA_ID") or ""
          dry = os.environ.get("DRY") == "true"
          run = os.environ.get("RUN_URL", "")

          if ok and media:
              head, body = "\u2705 Reel published", f"{slug}\nmedia_id {media}"
          elif ok and dry:
              head, body = "\u2139\ufe0f Dry run complete", slug
          elif ok:
              head, body = "\u2139\ufe0f Ran clean, not published", slug
          else:
              head, body = "\u274c Reel run FAILED", (
                  f"slug: {slug}\nstage: {os.environ.get('STATUS')}\n"
                  f"Nothing was published. Check logs:\n{run}")

          text = f"{head}\n\n{body}\n\n{run}"
          r = requests.post(f"https://api.telegram.org/bot{tok}/sendMessage",
                            json={"chat_id": chat, "text": text,
                                  "disable_web_page_preview": True}, timeout=20)
          print("telegram:", r.status_code, r.text[:160])
          PY

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.brief.outputs.slug }}
          path: |
            video_studio/output/${{ steps.brief.outputs.slug }}/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit topic history so tomorrow does not repeat today
        if: ${{ github.event_name == 'schedule' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video_studio/data/topic_history.json || true
          git diff --staged --quiet || git commit -m "chore: topic history $(date -u +%F)"
          git push || echo "push failed (history may repeat one topic)"

      - name: Remove .env
        if: always()
        run: rm -f .env