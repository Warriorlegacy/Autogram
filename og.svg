    <circle cx="18" cy="24" r="4" fill="#1E293B"/>
    <circle cx="34" cy="24" r="4" fill="#1E293B"/>
    <circle cx="50" cy="24" r="4" fill="#1E293B"/>
    <text x="72" y="28" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748B">autogram --status</text>

    <text x="20" y="84" font-family="JetBrains Mono, monospace" font-size="13" fill="#00FFA3">[OK] engine online</text>
    <text x="20" y="110" font-family="JetBrains Mono, monospace" font-size="13" fill="#94A3B8">6-layer pipeline · zero-touch</text>
    <text x="20" y="136" font-family="JetBrains Mono, monospace" font-size="13" fill="#94A3B8">fact-check gate: fail-closed</text>
    <text x="20" y="162" font-family="JetBrains Mono, monospace" font-size="13" fill="#94A3B8">renderer: 1080x1350 JPEG</text>

    <g transform="translate(20 190)">
