    <text x="58" y="28" font-family="Space Grotesk, Inter, sans-serif" font-size="26" font-weight="700" fill="#F8FAFC">Autogram<tspan fill="#00F0FF">.AI</tspan></text>
  </g>

  <text x="72" y="200" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="58" font-weight="800" fill="#F8FAFC">Instagram,</text>
  <text x="72" y="268" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="58" font-weight="800" fill="url(#cyan)">on autopilot.</text>
  <text x="74" y="318" font-family="Inter, sans-serif" font-size="22" fill="#94A3B8">Research. Write. Render. Publish. Zero human hours.</text>

  <g transform="translate(74 360)">
    <rect width="230" height="44" rx="6" fill="url(#cyan)"/>
    <text x="115" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#04060A">Meta Graph API</text>
    <text x="248" y="28" font-family="JetBrains Mono, monospace" font-size="14" fill="#64748B">deterministic · policy-compliant</text>
  </g>

  <g transform="translate(740 100)">
    <rect width="388" height="420" rx="16" fill="#0A1124" stroke="#1E293B"/>
