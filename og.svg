      <text x="14" y="48" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Why single prompts fail.</text>
      <text x="14" y="70" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">Separate research, draft, verify.</text>
    </g>

    <g transform="translate(20 292)">
