name = "autogram-cron-dispatcher"
main = "worker-cron-dispatcher.js"
compatibility_date = "2024-11-01"

[vars]
GITHUB_REPO = "Warriorlegacy/Autogram"

# Cron Triggers (UTC) mapped to India Standard Time (IST = UTC + 5:30)
# Optimal 2-Drop Growth Cadence: 1 Midday Carousel + 1 Evening Reel
[triggers]
crons = [
  "0 7 * * *",   # 12:30 PM IST — Midday Prime Carousel
  "0 14 * * *"   # 07:30 PM IST — Evening Prime Viral Reel
]

